<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
</head>
<body>
	<form action="#" method="post">
	<label for="full-name">Full Name:</label>
        <input type="text" id="full-name" name="fullName" required minlength="3">
        <br><br>
        <label for="email-addr">Email Address:</label>
        <input type="email" id="email-addr" name="email" required>
        <br><br>
        <label for="pass">Password:</label>
        <input type="password" id="pass" name="password" required minlength="6">
	<br><br>
	<label>Account Type:</label>
        <input type="radio" id="student" name="role" value="student" required>
        <label for="student">Student</label>
        <input type="radio" id="developer" name="role" value="developer">
        <label for="developer">Developer</label>
        <br><br>
        <label for="country">Your Nationality:</label>
        <select id="country" name="country" required>
            <option value="">Select country</option>
            <option value="jordan">Jordan</option>
            <option value="uae">UAE</option>
            <option value="saudi">Saudi Arabia</option>
            <option value="other">Other</option>
        </select>
        <br><br><br>
        
        <label for="bio">Short Bio:</label>
        <textarea id="bio" name="bio" rows="4" cols="40" minlength="10" required>
        </textarea>
        <br><br>  
	<input type="checkbox" id="terms" name="terms" required>
	<label for="terms">I agree to the terms and conditions</label>
	<br><br>
	<button type="submit">Register</button>
</form>      
</body>
</html>
